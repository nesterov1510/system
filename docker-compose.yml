# MSB — Docker Compose (MVP).
# `docker compose up -d` поднимает БД + API + web.
# print-agent ставится на машине у стойки приёма (в LAN с принтером).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msb}
      POSTGRES_DB: ${POSTGRES_DB:-msb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-msb}:${POSTGRES_PASSWORD:-msb}@postgres:5432/${POSTGRES_DB:-msb}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3030}
      CORS_ORIGINS: '["${WEB_ORIGIN:-http://localhost:3030}"]'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@msb.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8085}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://api:8085}
    depends_on:
      - api
    ports:
      - "3030:3030"

  # Опционально: S3-совместимое хранилище фото (итерация 4+).
