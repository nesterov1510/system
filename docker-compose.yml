# MSB — Docker Compose (MVP).
# `docker compose up -d` поднимает БД + API + web.
# print-agent ставится на машине у стойки приёма (в LAN с принтером).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msb}
      POSTGRES_DB: ${POSTGRES_DB:-msb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # База нужна только контейнеру api. Наружу публикуем лишь на loopback,
    # чтобы PostgreSQL с паролем из .env не был виден всей локальной сети.
    # Для отладки с хоста этого достаточно (psql -h 127.0.0.1 -U msb).
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-msb}:${POSTGRES_PASSWORD:-msb}@postgres:5432/${POSTGRES_DB:-msb}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3030}
      CORS_ORIGINS: '["${WEB_ORIGIN:-http://localhost:3030}"]'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@msb.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      UPLOAD_DIR: /app/uploads
      # Параметры SMS-шлюза передаются ТОЛЬКО через env — в коде их нет.
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_USERNAME: ${SMS_GATEWAY_USERNAME:-}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Фотографии ремонта живут на диске: без тома они исчезали при любом
    # `docker compose up --build` или пересоздании контейнера.
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "8085:8085"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8085}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://api:8085}
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "3030:3030"

  # Опционально: S3-совместимое хранилище фото (итерация 4+).
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - miniodata:/data

volumes:
  pgdata:
  uploads:
