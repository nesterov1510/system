# RemontFlow — Docker Compose (MVP).
# `docker compose up -d` поднимает БД + API + web.
# print-agent ставится на машине у стойки приёма (в LAN с принтером).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remontflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remontflow}
      POSTGRES_DB: ${POSTGRES_DB:-remontflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remontflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remontflow}:${POSTGRES_PASSWORD:-remontflow}@postgres:5432/${POSTGRES_DB:-remontflow}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: '["${WEB_ORIGIN:-http://localhost:3000}"]'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@remontflow.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Опционально: S3-совместимое хранилище фото (итерация 4+).
