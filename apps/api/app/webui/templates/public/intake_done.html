<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Принято — {{ number }}</title>
  <link rel="stylesheet" href="/static/msb/base.css">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(155deg,#0d151c,#192d39)}
    .card{width:min(520px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 28px 70px rgba(6,12,18,.35)}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .logo .badge{width:52px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#ff932e,#ff6a00);color:#fff;font-weight:900}
    .kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:#e87000;text-transform:uppercase}
    h1{font-family:ui-monospace,Menlo,monospace;font-size:24px;margin:6px 0 4px}
    .dev{color:#4c5964;font-size:15px;margin-bottom:18px}
    .ok{display:inline-flex;align-items:center;gap:8px;background:#e9f7ee;color:#1d7a45;border:1px solid #bfe6cf;border-radius:12px;padding:10px 16px;font-weight:800;margin-bottom:18px}
    .next{background:#f6f8fa;border:1px solid #e6ebef;border-radius:14px;padding:14px 16px;font-size:13.5px;color:#4c5964;line-height:1.5;margin-bottom:18px}
    .link{display:block;background:#fff3e8;border:1px solid #ffe0bf;border-radius:12px;padding:13px 15px;font-weight:800;color:#c45f00;text-decoration:none;word-break:break-all;margin-bottom:14px}
    .again{display:block;text-align:center;min-height:46px;line-height:46px;border-radius:12px;background:#20303c;color:#fff;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="badge" aria-hidden="true">🧰</span><div><strong>MSB</strong></div></div>
    <div class="kicker">Приёмка оформлена</div>
    <h1>{{ number }}</h1>
    <p class="dev">{{ device }}</p>
    <div class="ok">✓ Техника принята в сервисный центр</div>
    <div class="next">
      Ремонту присвоен номер <b>{{ number }}</b>. Он уже в очереди — мастер возьмёт его
      в работу, а статус можно смотреть по ссылке ниже (она же зашита в QR на бланке).
    </div>
    <a class="link" href="{{ public_url }}">{{ public_url }}</a>
    <a class="again" href="/intake">Оформить ещё одну приёмку</a>
  </div>
</body>
</html>
