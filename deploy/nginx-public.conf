# /etc/nginx/sites-available/msb-public.conf
# Публикует в интернет только то, что видит клиент: страницу статуса ремонта
# /r/{token}, её JSON и один CSS. Приёмка, админка, справочники и остальной API
# остаются во внутренней сети (msb-api.service на 127.0.0.1:8085).
#
#   sudo cp deploy/nginx-public.conf /etc/nginx/sites-available/msb-public.conf
#   sudo ln -s /etc/nginx/sites-available/msb-public.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# За спиной nginx — публичный экземпляр с PUBLIC_ONLY=true (порт 8086), поэтому
# закрыто дважды: и правилами ниже, и самим приложением.

upstream msb_public {
    server 127.0.0.1:8086;
}

server {
    listen 80;
    server_name status.example.com;          # ← ваш домен

    # HTTPS: certbot --nginx -d status.example.com допишет блок listen 443 ssl
    # и перенаправление с 80. До выдачи сертификата сайт работает по http.

    client_max_body_size 1m;

    location = /health               { proxy_pass http://msb_public; }
    location = /static/msb/base.css  { proxy_pass http://msb_public; }
    location /r/                     { proxy_pass http://msb_public; }
    location /api/public/            { proxy_pass http://msb_public; }

    # Всё остальное снаружи не существует.
    location / { return 404; }

    # Общие заголовки прокси (для location'ов выше).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
}
